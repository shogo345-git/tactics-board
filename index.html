<title>作戦ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFEA; --panel:#FFFFFF; --ink:#13241A; --muted:#5A6D61; --line:#CFDAD2; --accent:#1C6A43; --accent-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; }
}
:root[data-theme="dark"]{ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.bar{display:flex;align-items:center;gap:6px;padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px));flex:none}
.bscroll{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:1;min-width:0}
.btn.icon{width:46px;padding:0;justify-content:center}
.seg.tools{flex:none}
.seg.tools button{width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center}
#bUndo{flex:none}
.bar h1{font-size:17px;font-weight:700;margin:0 8px 0 2px;white-space:nowrap;letter-spacing:.02em}
.bar .sp{flex:1;min-width:4px}
body.playing .bscroll>*:not(h1),body.playing #bUndo,body.playing .tools{opacity:.35;pointer-events:none}
#bFull[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:transparent;min-height:38px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:0 max(6px,env(safe-area-inset-left,0px)) 4px max(6px,env(safe-area-inset-right,0px))}
svg#board{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.dock{flex:none;height:62px;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.dock .float{position:static;transform:none;box-shadow:0 2px 10px rgba(10,30,18,.14);max-width:100%}
#penBar{gap:6px;padding:6px}
#penBar .seg button{padding:0 8px;font-size:13px}
#penBar .vsep{display:none}
#penBar #penColors{gap:5px!important}
#penBar .pc{width:24px;height:24px}
body.pen svg#board{cursor:crosshair}
body.erase svg#board{cursor:cell}
body.text svg#board{cursor:text}
.note{font-weight:700;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.72);stroke-width:.6px;stroke-linejoin:round;pointer-events:none}
.zl{font-weight:700;fill:rgba(255,255,255,.6);pointer-events:none}
.float.top{top:10px;bottom:auto}
#tText{width:220px}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;text-anchor:middle;pointer-events:none}
.nm{font-weight:700;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#123A24;stroke-width:.5px;stroke-linejoin:round;pointer-events:none}
body.move .tok, body.move #ball{cursor:grab}
.float{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(10,30,18,.22);max-width:calc(100% - 20px);overflow-x:auto}
.float[hidden]{display:none}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:38px;padding:0 10px;min-width:0}
#insp .n{width:58px;text-align:center}
#insp .m{width:150px}
.ib{border:0;background:transparent;font-size:20px;width:36px;height:36px;border-radius:8px;color:var(--muted);flex:none}
.pc{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);flex:none}
.pc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.vsep{width:1px;align-self:stretch;background:var(--line);flex:none}
.plabel{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;min-width:54px;text-align:center;flex:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 20px));max-height:min(86vh,760px)}
dialog::backdrop{background:rgba(6,18,11,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.dh h2{font-size:18px;margin:0}
.db{padding:6px 16px 18px;overflow:auto;max-height:calc(min(86vh,760px) - 60px)}
.db h3{font-size:15px;margin:22px 0 4px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs .btn{flex:1;justify-content:center}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{width:96px;flex:none;font-size:14px;color:var(--muted)}
.row .grow{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.step{display:flex;align-items:center;gap:6px}
.step output{min-width:34px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
.roster{display:grid;grid-template-columns:56px 1fr 118px;gap:6px;margin-top:6px}
.roster select{width:100%}
.roster input.n{text-align:center}
.hint{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.scenes{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.scenes li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px}
.scenes .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;width:26px;text-align:center;color:var(--muted);flex:none}
.scenes .open{flex:1;min-width:0;border:0;background:transparent;text-align:left;min-height:38px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:700}
.scenes .sb{min-height:36px;padding:0 9px;font-size:13px}
.empty{color:var(--muted);font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100vw - 24px)}
.toast[hidden]{display:none}
@media (max-width:620px){.bar h1{display:none}.btn,.seg button{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

const F={

 7:{'2-3-1':[[.06,.5],[.38,.3],[.38,.7],[.66,.18],[.66,.5],[.66,.82],[.92,.5]],'3-2-1':[[.06,.5],[.38,.2],[.38,.5],[.38,.8],[.66,.33],[.66,.67],[.92,.5]]},
 8:{'3-3-1':[[.06,.5],[.36,.2],[.36,.5],[.36,.8],[.64,.18],[.64,.5],[.64,.82],[.92,.5]],

    '3-2-2':[[.06,.5],[.36,.2],[.36,.5],[.36,.8],[.62,.33],[.62,.67],[.9,.33],[.9,.67]]},
 11:{'4-4-2':[[.06,.5],[.34,.14],[.34,.38],[.34,.62],[.34,.86],[.64,.14],[.64,.38],[.64,.62],[.64,.86],[.92,.38],[.92,.62]],
  '4-3-3':[[.06,.5],[.34,.14],[.34,.38],[.34,.62],[.34,.86],[.62,.28],[.58,.5],[.62,.72],[.9,.16],[.94,.5],[.9,.84]],
  '4-2-3-1':[[.06,.5],[.34,.14],[.34,.38],[.34,.62],[.34,.86],[.56,.38],[.56,.62],[.78,.18],[.78,.5],[.78,.82],[.96,.5]],
  '3-5-2':[[.06,.5],[.34,.25],[.34,.5],[.34,.75],[.62,.08],[.58,.33],[.66,.5],[.58,.67],[.62,.92],[.92,.38],[.92,.62]],
  '3-4-3':[[.06,.5],[.34,.25],[.34,.5],[.34,.75],[.62,.12],[.62,.38],[.62,.62],[.62,.88],[.9,.18],[.94,.5],[.9,.82]]}
};
const REG={
 GK:{l:'GK',c:'GK',xy:[.06,.5]},
 RSB:{l:'右SB',c:'DF',xy:[.34,.88]},RCB:{l:'右CB',c:'DF',xy:[.34,.66]},CB:{l:'CB',c:'DF',xy:[.34,.5]},LCB:{l:'左CB',c:'DF',xy:[.34,.34]},LSB:{l:'左SB',c:'DF',xy:[.34,.12]},
 DMF:{l:'ボランチ',c:'MF',xy:[.54,.5]},RMF:{l:'右MF',c:'MF',xy:[.64,.88]},LMF:{l:'左MF',c:'MF',xy:[.64,.12]},OMF:{l:'トップ下',c:'MF',xy:[.76,.5]},
 RWG:{l:'右WG',c:'FW',xy:[.9,.85]},CF:{l:'CF',c:'FW',xy:[.94,.5]},LWG:{l:'左WG',c:'FW',xy:[.9,.15]}};
const REG_GROUPS=[['GK',['GK']],['DF',['RSB','RCB','CB','LCB','LSB']],['MF',['DMF','RMF','LMF','OMF']],['FW',['RWG','CF','LWG']]];
const regOf=p=>p.reg&&REG[p.reg]?REG[p.reg]:null;
function regOptions(v,auto){
  return `<option value="">${auto?`自動 ${auto}`:'未設定'}</option>`+REG_GROUPS.map(([g,ids])=>`<optgroup label="${g}">${ids.map(id=>`<option value="${id}"${id==v?' selected':''}>${REG[id].l}</option>`).join('')}</optgroup>`).join('');
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

function autoForm(n){
  const p=[[.06,.5]],m=n-1; if(m<=0) return p;
  const rows=m<=3?1:m<=7?2:3, base=Math.floor(m/rows), ex=m%rows;
  for(let r=0;r<rows;r++){const k=base+(r<ex?1:0),x=rows==1?.7:.34+r*(.58/(rows-1));
    for(let j=0;j<k;j++) p.push([x,(j+1)/(k+1)]);}
  return p;
}
function formsFor(n){return Object.keys(F[n]||{})}
/* square cost matrix -> a[row]=col with minimum total cost (Hungarian method) */
function hungarian(c){
  const n=c.length,u=Array(n+1).fill(0),v=Array(n+1).fill(0),p=Array(n+1).fill(0),way=Array(n+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0]=i;let j0=0;const minv=Array(n+1).fill(Infinity),used=Array(n+1).fill(false);
    do{used[j0]=true;const i0=p[j0];let d=Infinity,j1=0;
      for(let j=1;j<=n;j++)if(!used[j]){const cur=c[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<d){d=minv[j];j1=j}}
      for(let j=0;j<=n;j++)if(used[j]){u[p[j]]+=d;v[j]-=d}else minv[j]-=d;
      j0=j1;}while(p[j0]!=0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0);
  }
  const a=Array(n);for(let j=1;j<=n;j++)a[p[j]-1]=j-1;return a;
}
/* stretch points to 0..1 on each axis so the old shape and the new formation compare by relative position */
function normPts(l){
  if(!l.length) return l;
  const xs=l.map(q=>q[0]),ys=l.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return l.map(([x,y])=>[x1-x0>.02?(x-x0)/(x1-x0):.5,y1-y0>.02?(y-y0)/(y1-y0):.5]);
}
/* own-half coordinates: x 0=own goal → 1=halfway line and beyond, y 0..1 across (same as F) */
function toLocal(ti,p){return ti==0?[p.x/(W/2),p.y/H]:[(W-p.x)/(W/2),(H-p.y)/H]}
/* GK / DF / MF / FW for each slot of a formation: deepest line = DF, front line = FW, lines between = MF */
function lineRoles(pts){
  const xs=[...new Set(pts.slice(1).map(q=>q[0]))].sort((a,b)=>a-b), lines=[];
  xs.forEach(x=>{const l=lines[lines.length-1];if(l&&x-l[l.length-1]<.06)l.push(x);else lines.push([x])});
  return pts.map((q,i)=>{if(!i)return 'GK';const li=lines.findIndex(l=>l.includes(q[0]));
    return lines.length==1?'MF':li==0?'DF':li==lines.length-1?'FW':'MF'});
}
function formPts(t){return (F[t.count]&&F[t.count][t.formation])||autoForm(t.count)}
/* players saved before positions existed: give them GK/DF/MF/FW from where they stand now, without moving anyone */
function ensurePos(ti){
  const t=S.teams[ti]; if(t.players.every(p=>p.pos)) return;
  const pts=formPts(t); if(pts.length!=t.players.length) return;
  const slot=assignSlots(t.players.map(p=>typeof p.x=='number'?{xy:toLocal(ti,p)}:null),pts), roles=lineRoles(pts);
  t.players.forEach((p,i)=>{if(!p.pos)p.pos=roles[slot[i]]});
}
/* players: per-player own-half coords (or null) → slot index in pts; deepest player takes the GK slot */
/* items[i] = {xy, reg} per player (or null for a new player) → slot index in pts.
   Registered players: stay in their line (DF/MF/FW) as far as the slot counts allow (moving one line at a time),
   then the same lane (wide / half-space / centre), then the nearest spot.
   When someone has to change line, wide players (SB, side MF) go first: SB→WB, side MF→winger.
   Others: nearest slot by relative position. The GK slot goes to the registered GK, else the deepest player. */
const LINE_IDX={GK:0,DF:0,MF:1,FW:2};
const lane=y=>y<.2?0:y<.4?1:y<=.6?2:y<=.8?3:4; // 大外・ハーフスペース・中央・ハーフスペース・大外
function assignSlots(items,pts){
  const idx=items.map((_,i)=>i), slot=idx.slice(), known=idx.filter(i=>items[i]);
  if(!known.length) return slot;
  const gkScore=i=>{const it=items[i];return !it?99:it.reg?(it.reg.c=='GK'?-10:10+it.xy[0]):it.xy[0]};
  const gk=idx.reduce((a,b)=>gkScore(b)<gkScore(a)?b:a), rows=idx.filter(i=>i!=gk), dst=pts.slice(1), dcat=lineRoles(pts).slice(1);
  const free=rows.filter(i=>items[i]&&!items[i].reg), A=normPts(free.map(i=>items[i].xy)), B=normPts(dst), npos=new Map(free.map((i,k)=>[i,A[k]]));
  const as=hungarian(rows.map(i=>dst.map((q,k)=>{const it=items[i];if(!it)return 0;
    if(it.reg){const dl=LINE_IDX[it.reg.c]-LINE_IDX[dcat[k]],wide=lane(it.xy[1])%4==0;
      // tiny pull toward the spot remembered at registration (p.tie): players with the same position keep their left/right order
      const tie=it.tie?.001*((it.tie[0]-q[0])**2+(it.tie[1]-q[1])**2):0;
      return (wide?7:10)*dl*dl+3*(1+dl*dl)*Math.abs(lane(it.xy[1])-lane(q[1]))+Math.abs(it.xy[1]-q[1])+.5*Math.abs(it.xy[0]-q[0])+tie}
    const a=npos.get(i),dx=a[0]-B[k][0],dy=a[1]-B[k][1];return dx*dx+dy*dy})));
  slot[gk]=0; rows.forEach((i,r)=>slot[i]=as[r]+1);
  return slot;
}
/* A player with a registered position (p.reg) always goes to the slot nearest that position.
   Others keep a fixed role (p.role, own-half coords) and the spot he was last placed at (p.home).
   While nobody has been dragged since the last arrangement, roles stay fixed, so the result depends only on
   the chosen formation (A→B→A gives the same layout). If someone was moved, the current layout becomes the new roles. */
function applyFormation(ti){
  const t=S.teams[ti], n=t.count;
  while(t.players.length<n){const used=new Set(t.players.map(p=>+p.num));let k=t.players.length+1;while(used.has(k))k++;t.players.push({num:String(k),name:''})}
  t.players.length=n;
  const pts=(F[n]&&F[n][t.formation])||autoForm(n);
  const placed=p=>typeof p.x=='number';
  const free=t.players.filter(p=>!regOf(p));
  const kept=free.some(p=>p.role)&&free.every(p=>!p.role||!placed(p)||p.home&&Math.hypot(p.x-p.home[0],p.y-p.home[1])<.5);
  if(!kept) free.forEach(p=>{p.role=placed(p)?toLocal(ti,p):null});
  const slot=assignSlots(t.players.map(p=>regOf(p)?{xy:regOf(p).xy,reg:regOf(p),tie:p.tie||(p.tie=placed(p)?toLocal(ti,p):null)}:p.role?{xy:p.role}:null),pts), roles=lineRoles(pts);
  t.players.forEach((p,i)=>{const [fx,fy]=pts[slot[i]]; p.pos=roles[slot[i]];
    if(ti==0){p.x=fx*W/2;p.y=fy*H;p.a=0}else{p.x=W-fx*W/2;p.y=H-fy*H;p.a=180}
    if(!p.role) p.role=[fx,fy];
    p.home=[p.x,p.y];});
}
function fresh(){
  return {teams:[
    {name:'ホーム',color:COLORS[0],count:11,formation:'4-3-3',visible:true,players:[]},
    {name:'アウェイ',color:COLORS[1],count:11,formation:'4-4-2',visible:true,players:[]}],
    ball:{x:W/2,y:H/2},drawings:[],showNames:true,scenes:[]};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
const firstLaunch=!S;
if(!S||!Array.isArray(S.teams)){S=fresh();S.teams.forEach((_,i)=>applyFormation(i))}
if(!Array.isArray(S.drawings)) S.drawings=[];
if(!S.homeBlue){S.homeBlue=true;const h=S.teams[0],a=S.teams[1];if(h&&a&&h.color=='#D7263D'&&a.color=='#1F4FD6'){h.color='#1F4FD6';a.color='#D7263D'}}

let sel=null, vertical=false, undo=[], drag=null, saveT=0, mode='move';
let pen={kind:'run',color:PEN_COLORS[0],shape:'free'};
let editing=null, editUndo=false, txtColor=PEN_COLORS[0];
let msel=null, multi=false; // multi: tapping adds/removes, dragging from anywhere unselected draws a box // multi-selection {p:Set('t:i'),ball:bool,d:Set(drawing index)}
const TS=2.4;
/* token shape per position: d = outline drawn in pitch coords pointing toward the opponent's goal (+x),
   b = where the facing arrow starts, ox = number offset along the attack direction, ty/fs = number placement */
const SHAPES={
  GK:{d:'<rect x="-1.75" y="-1.75" width="3.5" height="3.5" rx=".35" $S/>',b:2.3,ox:0,ty:.72,fs:2.1},
  DF:{d:'<rect x="-1.75" y="-1.75" width="3.5" height="3.5" rx=".35" $S/>',b:2.3,ox:0,ty:.72,fs:2.1},
  MF:{d:`<circle r="${R}" $S/>`,b:R+.3,ox:0,ty:.72,fs:2.1},
  FW:{d:'<path d="M2.75 0L-1.5 2.45L-1.5 -2.45Z" $S/>',b:3,ox:-.3,ty:.66,fs:1.85}};

function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}

function snap(){return JSON.stringify(board())}
/* boards saved before positions existed: take each player's GK/DF/MF/FW from the current board */
function fillPos(o){(o.teams||[]).forEach((t,ti)=>(t.players||[]).forEach((p,i)=>{const c=S.teams[ti]&&S.teams[ti].players[i];if(!p.pos&&c&&c.pos)p.pos=c.pos}))}

/* ---------- pitch ---------- */
function drawPitch(){
  const L='fill="none" stroke="rgba(255,255,255,.88)" stroke-width=".24"';
  let s=`<rect x="-4" y="-4" width="${W+8}" height="${H+8}" rx="1.2" fill="#24683F"/>`;
  for(let i=0;i<10;i++) s+=`<rect x="${i*10.5}" y="0" width="10.5" height="${H}" fill="${i%2?'#2A7849':'#2E8250'}"/>`;
  const dy=Math.sqrt(9.15*9.15-5.5*5.5);
  s+=`<rect x="0" y="0" width="${W}" height="${H}" ${L}/>
  <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" ${L}/>
  <circle cx="${W/2}" cy="${H/2}" r="9.15" ${L}/>
  <circle cx="${W/2}" cy="${H/2}" r=".35" fill="rgba(255,255,255,.88)"/>
  <rect x="0" y="13.84" width="16.5" height="40.32" ${L}/>
  <rect x="${W-16.5}" y="13.84" width="16.5" height="40.32" ${L}/>
  <rect x="0" y="24.84" width="5.5" height="18.32" ${L}/>
  <rect x="${W-5.5}" y="24.84" width="5.5" height="18.32" ${L}/>
  <circle cx="11" cy="34" r=".3" fill="rgba(255,255,255,.88)"/><circle cx="${W-11}" cy="34" r=".3" fill="rgba(255,255,255,.88)"/>
  <path d="M16.5 ${34-dy} A9.15 9.15 0 0 1 16.5 ${34+dy}" ${L}/>
  <path d="M${W-16.5} ${34-dy} A9.15 9.15 0 0 0 ${W-16.5} ${34+dy}" ${L}/>
  <rect x="-1.6" y="30.34" width="1.6" height="7.32" ${L}/>
  <rect x="${W}" y="30.34" width="1.6" height="7.32" ${L}/>
  <path d="M1 0A1 1 0 0 1 0 1M${W-1} 0A1 1 0 0 0 ${W} 1M0 ${H-1}A1 1 0 0 1 1 ${H}M${W} ${H-1}A1 1 0 0 0 ${W-1} ${H}" ${L}/>`;
  $('pitch').innerHTML=s;
}
function zonesSVG(cr){
  if(!S.showZones) return '';
  const lane='stroke="rgba(255,255,255,.5)" stroke-width=".18" stroke-dasharray=".9 .9"';
  const zone='stroke="rgba(255,225,77,.75)" stroke-width=".26" stroke-dasharray="1.6 1"';
  const lab=(x,y,t,a)=>`<g transform="translate(${x} ${y}) rotate(${cr})"><text class="zl" font-size="1.35" text-anchor="${a}" y=".45">${t}</text></g>`;
  let s='';
  [13.84,24.84,H-24.84,H-13.84].forEach(y=>s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" ${lane}/>`);
  [W/3,W*2/3].forEach(x=>s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" ${zone}/>`);
  [[6.92,'大外'],[19.34,'ハーフスペース'],[34,'中央'],[H-19.34,'ハーフスペース'],[H-6.92,'大外']].forEach(([y,t])=>s+=lab(W/3+.8,y,t,'start'));
  [[W/6,'ディフェンシブサード'],[W/2,'ミドルサード'],[W*5/6,'アタッキングサード']].forEach(([x,t])=>s+=lab(x,H-1.4,t,cr?'end':'middle'));
  return s;
}
function inkFor(hex){const c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;return (r*299+g*587+b*114)/1000>160?'#13241A':'#FFFFFF'}

/* ---------- drawings ---------- */
function pathD(p){
  if(p.length<2) return '';
  let d=`M${p[0][0].toFixed(2)} ${p[0][1].toFixed(2)}`;
  if(p.length==2) return d+`L${p[1][0].toFixed(2)} ${p[1][1].toFixed(2)}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;d+=`Q${p[i][0].toFixed(2)} ${p[i][1].toFixed(2)} ${mx.toFixed(2)} ${my.toFixed(2)}`}
  const l=p[p.length-1];return d+`L${l[0].toFixed(2)} ${l[1].toFixed(2)}`;
}
function textW(d){return [...d.text].reduce((s,c)=>s+(c.charCodeAt(0)>255?1:.58),0)*TS}
function textSVG(d,i,cr){
  const [x,y]=d.pts[0], w=Math.max(textW(d),TS*2);
  const box=i===editing?`<rect x="${-w/2-.7}" y="${-TS*.75}" width="${w+1.4}" height="${TS*1.5}" rx=".5" fill="none" stroke="#FFE14D" stroke-width=".2" stroke-dasharray=".7 .5"/>`:'';
  return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${cr})">${box}<text class="note" font-size="${TS}" y="${(TS*.35).toFixed(2)}" fill="${d.color}">${esc(d.text)}</text></g>`;
}
function hitText(d,x,y){
  const [px,py]=d.pts[0], a=vertical?Math.PI/2:0, dx=x-px, dy=y-py;
  return Math.abs(dx*Math.cos(a)+dy*Math.sin(a))<Math.max(textW(d),TS*2)/2+.8 && Math.abs(-dx*Math.sin(a)+dy*Math.cos(a))<TS*.75+.5;
}
function hitTextAt(x,y){for(let k=S.drawings.length-1;k>=0;k--){const d=S.drawings[k];if(d.kind=='text'&&hitText(d,x,y))return k}return -1}
function drawingSVG(d){
  if(d.kind=='text') return '';
  const p=d.pts; if(p.length<2) return '';
  const dash=d.kind=='pass'?' stroke-dasharray="1.1 .8"':'';
  const line=`<path d="${pathD(p)}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".85" stroke-linecap="round" stroke-linejoin="round"${dash}/>
    <path d="${pathD(p)}" fill="none" stroke="${d.color}" stroke-width=".48" stroke-linecap="round" stroke-linejoin="round"${dash}/>`;
  if(d.head===false) return `<g>${line}</g>`; // freehand: plain line (lets people write letters)
  const E=p[p.length-1]; let B=p[0];
  for(let i=p.length-2;i>=0;i--){if(Math.hypot(E[0]-p[i][0],E[1]-p[i][1])>=1.8){B=p[i];break}}
  const a=Math.atan2(E[1]-B[1],E[0]-B[0]), L=1.7, w=.95;
  const bx=E[0]-L*Math.cos(a), by=E[1]-L*Math.sin(a);
  const h=`M${E[0].toFixed(2)} ${E[1].toFixed(2)}L${(bx+w*Math.sin(a)).toFixed(2)} ${(by-w*Math.cos(a)).toFixed(2)}L${(bx-w*Math.sin(a)).toFixed(2)} ${(by+w*Math.cos(a)).toFixed(2)}Z`;
  return `<g>${line}
    <path d="${h}" fill="${d.color}" stroke="rgba(0,0,0,.25)" stroke-width=".12"/></g>`;
}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function hitDrawing(x,y){
  for(let k=S.drawings.length-1;k>=0;k--){const d=S.drawings[k],p=d.pts;
    if(d.kind=='text'){if(hitText(d,x,y))return k;continue}
    for(let i=0;i<p.length-1;i++) if(segDist(x,y,p[i],p[i+1])<1.6) return k;}
  return -1;
}

/* ---------- render ---------- */

  $('drawL').innerHTML=S.drawings.map(drawingSVG).join('')+(drag&&drag.k=='pen'?drawingSVG(drag.d):'');
  let s='';
  S.teams.forEach((t,ti)=>{ if(!t.visible) return; ensurePos(ti); const ink=inkFor(t.color), edge=ink=='#FFFFFF'?'#FFFFFF':'#13241A';
    t.players.forEach((p,i)=>{
      const nm=S.showNames&&p.name?`<text class="nm" y="${R+2.3}" font-size="1.65">${esc(p.name)}</text>`:'';
      const sh=SHAPES[regOf(p)?regOf(p).c:p.pos]||SHAPES.MF, st=`fill="${t.color}" stroke="${edge}" stroke-width=".32" stroke-linejoin="round"`;

        <g transform="rotate(${ti?180:0})">${sh.d.replace('$S',st)}<g transform="translate(${sh.ox} 0) rotate(${cr-(ti?180:0)})"><text class="num" y="${sh.ty}" font-size="${sh.fs}" fill="${ink}">${esc(p.num)}</text></g></g>

    <path d="M0 -.5L.48 -.15L.3 .4L-.3 .4L-.48 -.15Z" fill="#111"/></g></g>`;
  let h='';
  if(mode=='move'&&!play&&sel&&S.teams[sel.t]&&S.teams[sel.t].players[sel.i]&&S.teams[sel.t].visible){
    const p=S.teams[sel.t].players[sel.i],rr=5.2,a=p.a*Math.PI/180;

      <circle r="${R+.9}" fill="none" stroke="#FFE14D" stroke-width=".4"/>
      <circle r="${rr}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".18" stroke-dasharray=".7 .6"/>
      <line x1="0" y1="0" x2="${rr*Math.cos(a)}" y2="${rr*Math.sin(a)}" stroke="rgba(255,255,255,.75)" stroke-width=".16"/></g>
      <g data-handle="1" transform="translate(${p.x+rr*Math.cos(a)} ${p.y+rr*Math.sin(a)})" style="cursor:grab">
        <circle r="2.6" fill="transparent"/><circle r="1.05" fill="#FFE14D" stroke="#13241A" stroke-width=".2"/></g>`;
    const t=S.teams[sel.t];
    $('insp').hidden=false; $('iDot').style.background=t.color;
    if(document.activeElement!==$('iNum')) $('iNum').value=p.num;
    if(document.activeElement!==$('iName')) $('iName').value=p.name;
    if(document.activeElement!==$('iPos')) $('iPos').innerHTML=regOptions(p.reg||'',p.pos);
  } else { $('insp').hidden=true; sel=null; }
  pruneMsel();
  if(msel&&mode=='move'&&!play){
    const ring='fill="none" stroke="#FFE14D" stroke-width=".4" pointer-events="none"';
    msel.p.forEach(k=>{const [t,i]=k.split(':').map(Number),p=S.teams[t].players[i];h+=`<circle cx="${p.x}" cy="${p.y}" r="${R+.9}" ${ring}/>`});
    if(msel.ball) h+=`<circle cx="${S.ball.x}" cy="${S.ball.y}" r="3" ${ring}/>`;
    msel.d.forEach(k=>{const d=S.drawings[k];
      if(d.kind=='text'){const w=Math.max(textW(d),TS*2);h+=`<g transform="translate(${d.pts[0][0]} ${d.pts[0][1]}) rotate(${cr})" pointer-events="none"><rect x="${-w/2-.7}" y="${-TS*.75}" width="${w+1.4}" height="${TS*1.5}" rx=".5" fill="none" stroke="#FFE14D" stroke-width=".3"/></g>`}
      else h+=`<path d="${pathD(d.pts)}" fill="none" stroke="rgba(255,225,77,.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`});
    const n=msel.p.size,parts=[];if(n)parts.push(`選手${n}人`);if(msel.ball)parts.push('ボール');if(msel.d.size)parts.push(`矢印・文字${msel.d.size}`);

  } else if(multi&&mode=='move'&&!play){$('mselTxt').textContent='選手・ボールをタップ、または囲んで選択';$('mselBar').hidden=false}
  else $('mselBar').hidden=true;
  if(drag&&drag.k=='box'&&drag.moved){const x=Math.min(drag.q.x,drag.q1.x),y=Math.min(drag.q.y,drag.q1.y);
    h+=`<rect x="${x}" y="${y}" width="${Math.abs(drag.q1.x-drag.q.x)}" height="${Math.abs(drag.q1.y-drag.q.y)}" fill="rgba(255,225,77,.12)" stroke="#FFE14D" stroke-width=".25" stroke-dasharray=".8 .6" pointer-events="none"/>`}
  $('selL').innerHTML=h;
  $('bNames').setAttribute('aria-pressed',S.showNames);
  $('bAway').setAttribute('aria-pressed',!S.teams[1].visible);

/* ---------- orientation ---------- */
function layout(){
  const w=$('board').clientWidth,hh=$('board').clientHeight, v=hh>w*1.05;

function beginEdit(k){editing=k;editUndo=false;const d=S.drawings[k];$('tText').value=d.text;txtColor=d.color;markTextColor(d.color);$('textBar').hidden=false;render()}
function endEdit(){

/* ---------- multi-selection ---------- */
function mselCount(){return msel?msel.p.size+(msel.ball?1:0)+msel.d.size:0}
function pruneMsel(){
  if(!msel) return;
  msel.p.forEach(k=>{const [t,i]=k.split(':').map(Number);if(!S.teams[t]||!S.teams[t].visible||!S.teams[t].players[i])msel.p.delete(k)});
  msel.d.forEach(k=>{if(!S.drawings[k])msel.d.delete(k)});
  if(!mselCount()) msel=null;
}
function mselToggle(kind,key){
  if(!msel){msel={p:new Set(),ball:false,d:new Set()};if(sel)msel.p.add(sel.t+':'+sel.i)}
  sel=null;
  if(kind=='ball') msel.ball=!msel.ball; else if(msel.p.has(key)) msel.p.delete(key); else msel.p.add(key);
  if(!mselCount()) msel=null;
}
function mselInBox(a,b,add){
  const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y),in_=(x,y)=>x>=x0&&x<=x1&&y>=y0&&y<=y1;
  const m={p:new Set(),ball:in_(S.ball.x,S.ball.y),d:new Set()};
  S.teams.forEach((t,ti)=>{if(t.visible)t.players.forEach((p,i)=>{if(in_(p.x,p.y))m.p.add(ti+':'+i)})});
  S.drawings.forEach((d,k)=>{if(d.pts.length&&d.pts.every(([x,y])=>in_(x,y)))m.d.add(k)});
  if(add&&msel){msel.p.forEach(k=>m.p.add(k));msel.d.forEach(k=>m.d.add(k));m.ball=m.ball||msel.ball}
  msel=m; sel=null; if(!mselCount()) msel=null;
}
function mselSnapshot(){
  return {p:[...msel.p].map(k=>{const [t,i]=k.split(':').map(Number),p=S.teams[t].players[i];return [p,p.x,p.y]}),
    ball:msel.ball?[S.ball.x,S.ball.y]:null, d:[...msel.d].map(k=>[S.drawings[k],clone(S.drawings[k].pts)])};
}
function mselMove(o,dx,dy){
  // clamp the whole group so it keeps its shape at the pitch edge
  const xs=[],ys=[];o.p.forEach(([,x,y])=>{xs.push(x);ys.push(y)});if(o.ball){xs.push(o.ball[0]);ys.push(o.ball[1])}
  o.d.forEach(([,pts])=>pts.forEach(([x,y])=>{xs.push(x);ys.push(y)}));
  dx=Math.max(-3-Math.min(...xs),Math.min(W+3-Math.max(...xs),dx)); dy=Math.max(-3-Math.min(...ys),Math.min(H+3-Math.max(...ys),dy));
  o.p.forEach(([p,x,y])=>{p.x=x+dx;p.y=y+dy});
  if(o.ball){S.ball.x=o.ball[0]+dx;S.ball.y=o.ball[1]+dy}
  o.d.forEach(([d,pts])=>{d.pts=pts.map(([x,y])=>[x+dx,y+dy])});
}
function setMulti(v){multi=v;msel=null;sel=null;$('bMulti').setAttribute('aria-pressed',v);if(v&&mode!='move')setMode('move');render()}
$('bMulti').onclick=()=>setMulti(!multi);
$('mselClear').onclick=()=>{msel=null;if(multi)setMulti(false);else render()};

/* ---------- pointer ---------- */
const svg=$('board');
function pt(e){const m=$('rot').getScreenCTM().inverse();const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return {x:q.x,y:q.y}}
const clampX=x=>Math.max(-3,Math.min(W+3,x)), clampY=y=>Math.max(-3,Math.min(H+3,y));
function eraseAt(q){const k=hitDrawing(q.x,q.y);if(k<0)return;if(!drag.moved){drag.moved=true;pushUndo()}S.drawings.splice(k,1);render()}
svg.addEventListener('pointerdown',e=>{
  if(play) return;
  const q=pt(e);
  if(mode=='pen'){drag={k:'pen',line:pen.shape=='line',d:{kind:pen.kind,color:pen.color,pts:[[clampX(q.x),clampY(q.y)]]}};if(!drag.line)drag.d.head=false;}
  else if(mode=='erase'){drag={k:'erase',moved:false};eraseAt(q)}
  else if(mode=='text'){
    const k=hitTextAt(q.x,q.y);
    if(k>=0){if(k!==editing){endEdit();beginEdit(hitTextAt(q.x,q.y))}const d=S.drawings[editing];drag={k:'txt',q,ox:d.pts[0][0],oy:d.pts[0][1],cx:e.clientX,cy:e.clientY,moved:false}}
    else if(editing!=null){endEdit();return}
    else{pushUndo();S.drawings.push({kind:'text',color:txtColor,text:'',pts:[[clampX(q.x),clampY(q.y)]]});beginEdit(S.drawings.length-1);editUndo=true;drag={k:'txtnew'}}
  }
  else{
    const hd=e.target.closest('[data-handle]'), tk=e.target.closest('.tok'), bl=e.target.closest('#ball');
    const base={q,cx:e.clientX,cy:e.clientY,moved:false,shift:e.shiftKey};
    if(hd&&sel) drag={k:'rot',moved:false};
    else if(msel&&(bl&&msel.ball||!bl&&tk&&msel.p.has(tk.dataset.t+':'+tk.dataset.i)))
      drag={...base,k:'group',tap:bl?['ball']:['p',tk.dataset.t+':'+tk.dataset.i]};
    else if(multi) drag={...base,k:'box',q1:q,tap:bl?['ball']:tk?['p',tk.dataset.t+':'+tk.dataset.i]:null};
    else if(bl) drag={...base,k:'ball',ox:S.ball.x,oy:S.ball.y};
    else if(tk){const t=+tk.dataset.t,i=+tk.dataset.i,p=S.teams[t].players[i];drag={...base,k:'p',t,i,ox:p.x,oy:p.y}}
    else drag={...base,k:'box',q1:q};
  }
  svg.setPointerCapture(e.pointerId); e.preventDefault();
});
svg.addEventListener('pointermove',e=>{
  if(!drag) return; const q=pt(e);
  if(drag.k=='pen'){const p=drag.d.pts,x=clampX(q.x),y=clampY(q.y);
    if(drag.line){p.length=1;p.push([x,y]);render();return}
    const l=p[p.length-1];if(Math.hypot(x-l[0],y-l[1])>.2){p.push([x,y]);render()}return}
  if(drag.k=='erase'){eraseAt(q);return}
  if(drag.k=='txtnew') return;
  if(drag.k=='txt'){if(editing==null)return;
    if(!drag.moved){if(Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)<5)return;drag.moved=true;editUndoOnce()}
    S.drawings[editing].pts[0]=[clampX(drag.ox+q.x-drag.q.x),clampY(drag.oy+q.y-drag.q.y)];render();return}
  if(drag.k=='rot'){const p=S.teams[sel.t].players[sel.i];
    if(!drag.moved){drag.moved=true;pushUndo()}
    p.a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI; render(); return;}
  if(drag.k=='box'){drag.q1=q;if(!drag.moved&&Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)>=5){drag.moved=true;sel=null}if(drag.moved)render();return}
  if(!drag.moved){ if(Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)<5) return; drag.moved=true; pushUndo(); if(drag.k=='group') drag.o=mselSnapshot(); }
  if(drag.k=='group'){mselMove(drag.o,q.x-drag.q.x,q.y-drag.q.y);render();return}
  const nx=clampX(drag.ox+q.x-drag.q.x), ny=clampY(drag.oy+q.y-drag.q.y);
  if(drag.k=='ball'){S.ball.x=nx;S.ball.y=ny}
  else{const p=S.teams[drag.t].players[drag.i];p.x=nx;p.y=ny}
  render();
});
function endDrag(){
  if(!drag) return;
  if(drag.k=='pen'){const p=drag.d.pts;let len=0;for(let i=1;i<p.length;i++)len+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
    if(!drag.line&&p.length==1)p.push([p[0][0]+.05,p[0][1]]); // a tap with the freehand pen leaves a dot
    if(len>=2||!drag.line){pushUndo();S.drawings.push(drag.d)}}
  else if(drag.k=='box'){ if(drag.moved) mselInBox(drag.q,drag.q1,multi); else if(drag.tap) mselToggle(drag.tap[0],drag.tap[1]); else if(!multi){sel=null;msel=null} }
  else if(drag.k=='group'&&!drag.moved){ mselToggle(drag.tap[0],drag.tap[1]); }
  else if(drag.k=='ball'&&!drag.moved&&(msel||drag.shift)){ mselToggle('ball'); }
  else if(drag.k=='p'&&!drag.moved&&(msel||drag.shift)){ mselToggle('p',drag.t+':'+drag.i); }
  else if(drag.k=='p'&&!drag.moved){ sel=(sel&&sel.t==drag.t&&sel.i==drag.i)?null:{t:drag.t,i:drag.i}; }
  else if(drag.k=='p'&&drag.moved&&!msel){ sel={t:drag.t,i:drag.i}; }
  else if((drag.k=='txtnew'||drag.k=='txt'&&!drag.moved)&&editing!=null){ $('tText').focus(); }
  drag=null; render(); save();
}
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);

/* ---------- inspector ---------- */
$('iNum').addEventListener('input',e=>{if(!sel)return;S.teams[sel.t].players[sel.i].num=e.target.value;render();save()});
$('iName').addEventListener('input',e=>{if(!sel)return;S.teams[sel.t].players[sel.i].name=e.target.value;render();save()});
function setReg(p,v,ti){if(v){p.reg=v;if(typeof p.x=='number')p.tie=toLocal(ti,p)}else{delete p.reg;delete p.tie}}
$('iPos').addEventListener('change',e=>{if(!sel)return;pushUndo();setReg(S.teams[sel.t].players[sel.i],e.target.value,sel.t);e.target.blur();render();save()});
$('iClose').onclick=()=>{sel=null;document.activeElement.blur();render()};

/* ---------- toolbar ---------- */
$('bNames').onclick=()=>{S.showNames=!S.showNames;render();save()};
$('bUndo').onclick=doUndo;
$('bAway').onclick=()=>{const t=S.teams[1];t.visible=!t.visible;if(sel&&sel.t==1)sel=null;render();save()};
$('bFace').onclick=()=>{pushUndo();S.teams.forEach(t=>t.players.forEach(p=>{p.a=Math.atan2(S.ball.y-p.y,S.ball.x-p.x)*180/Math.PI}));render();save()};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key=='z'&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();doUndo()}});

/* ---------- settings ---------- */
let tab=0;
function renderSettings(){
  const t=S.teams[tab], forms=formsFor(t.count);
  $('setBody').innerHTML=`<div class="tabs">${S.teams.map((x,i)=>`<button class="btn" data-tab="${i}" aria-pressed="${i==tab}"><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</button>`).join('')}</div>
  <div class="row"><label for="tName">チーム名</label><input id="tName" class="grow" value="${esc(t.name)}" maxlength="16"></div>
  <div class="row"><label>色</label><div class="sw">${COLORS.map(c=>`<button data-color="${c}" style="background:${c}" aria-label="色 ${c}" aria-pressed="${c==t.color}"></button>`).join('')}</div></div>
  ${tab==1?`<div class="row"><label>表示</label><button class="btn" id="tVis" aria-pressed="${t.visible}">${t.visible?'表示中':'非表示'}</button></div>`:''}
  <div class="row"><label>人数</label><div class="step"><button class="btn" data-step="-1" aria-label="減らす">−</button><output>${t.count}</output><button class="btn" data-step="1" aria-label="増やす">＋</button></div></div>
  <div class="row"><label for="tForm">フォーメーション</label>
    <select id="tForm" class="grow">${forms.map(f=>`<option ${f==t.formation?'selected':''}>${f}</option>`).join('')}<option value="auto" ${forms.includes(t.formation)?'':'selected'}>自動配置</option></select></div>
  <div class="row"><label></label><button class="btn primary" id="tApply">この配置に並べ直す</button></div>
  <p class="hint">5・7・8・11人はフォーメーションを選べます。それ以外の人数は自動で並びます。</p>
  <div class="roster" style="margin-top:14px"><span class="hint" style="margin:0">背番号</span><span class="hint" style="margin:0">名前</span><span class="hint" style="margin:0">ポジション</span>
  ${t.players.map((p,i)=>`<input class="n" data-num="${i}" value="${esc(p.num)}" inputmode="numeric" maxlength="3" aria-label="${i+1}人目の背番号"><input data-name="${i}" value="${esc(p.name)}" placeholder="名前" maxlength="14" aria-label="${i+1}人目の名前"><select data-reg="${i}" aria-label="${i+1}人目のポジション">${regOptions(p.reg||'',p.pos)}</select>`).join('')}</div>
  <p class="hint">ポジションを入れると、フォーメーションを変えても その位置に一番近い場所に並びます（形も GK・DF は四角、MF は丸、FW は三角）。入れ終わったら「この配置に並べ直す」で並び直せます。</p>`;
}
$('setBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const t=S.teams[tab];
  if(b.dataset.tab!=null){tab=+b.dataset.tab;renderSettings();return}
  if(b.dataset.color){t.color=b.dataset.color;renderSettings();render();save();return}
  if(b.id=='tVis'){t.visible=!t.visible;renderSettings();render();save();return}
  if(b.dataset.step){const n=Math.max(1,Math.min(11,t.count+ +b.dataset.step));if(n==t.count)return;pushUndo();t.count=n;
    const f=formsFor(n);if(!f.includes(t.formation))t.formation=f[0]||'auto';applyFormation(tab);sel=null;renderSettings();render();save();return}
  if(b.id=='tApply'){pushUndo();applyFormation(tab);sel=null;render();save();$('dSet').close();return}
});
$('setBody').addEventListener('input',e=>{
  const el=e.target,t=S.teams[tab];
  if(el.id=='tName'){t.name=el.value;save();return}
  if(el.dataset.num!=null){t.players[+el.dataset.num].num=el.value;render();save()}
  if(el.dataset.name!=null){t.players[+el.dataset.name].name=el.value;render();save()}
});
$('setBody').addEventListener('change',e=>{
  if(e.target.id=='tForm'){pushUndo();S.teams[tab].formation=e.target.value;applyFormation(tab);sel=null;render();save();toast('今のポジションを保ったまま並べ替えました')}
  if(e.target.id=='tName') renderSettings();
  if(e.target.dataset.reg!=null){pushUndo();setReg(S.teams[tab].players[+e.target.dataset.reg],e.target.value,tab);render();save()}
});
$('bSettings').onclick=()=>{renderSettings();$('dSet').showModal()};

/* ---------- scenes ---------- */
function renderScenes(){
  const l=S.scenes;
  $('scList').innerHTML=l.length?l.map((s,i)=>`<li><span class="no">${i+1}</span>
    <button class="open" data-open="${i}" title="この場面を開く">${esc(s.name)}</button>
    <button class="btn sb" data-up="${i}" ${i?'':'disabled'} aria-label="${esc(s.name)}を上へ">↑</button>
    <button class="btn sb" data-over="${i}">上書き</button>
    <button class="btn sb" data-del="${i}" aria-label="${esc(s.name)}を削除">削除</button></li>`).join('')
    :'<li class="empty" style="border:0;padding:0">まだ保存した場面はありません。名前を付けて保存すると、あとで開いたり、続けて再生したりできます。</li>';
  $('scName').value='';$('scName').placeholder=`場面 ${l.length+1}`;
}
$('bScenes').onclick=()=>{renderScenes();$('dScn').showModal()};
$('scSave').onclick=()=>{const name=$('scName').value.trim()||$('scName').placeholder;S.scenes.push({name,data:snap()});save();renderScenes();render();toast(`「${name}」を保存しました`)};
$('scList').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.open!=null){pushUndo();const o=JSON.parse(S.scenes[+b.dataset.open].data);fillPos(o);setBoard(o);sel=null;render();save();$('dScn').close()}
  if(b.dataset.up!=null){const i=+b.dataset.up;[S.scenes[i-1],S.scenes[i]]=[S.scenes[i],S.scenes[i-1]];save();renderScenes()}
  if(b.dataset.over!=null){const s=S.scenes[+b.dataset.over];s.data=snap();save();toast(`「${s.name}」を今の盤面で上書きしました`)}
  if(b.dataset.del!=null){S.scenes.splice(+b.dataset.del,1);save();renderScenes();render()}
});

/* ---------- file export / import ---------- */
let downloads=null;
if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(d=>{downloads=d}).catch(()=>{})}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`}
$('bExport').onclick=async()=>{
  const data=JSON.stringify({app:'tactics-board',version:1,savedAt:new Date().toISOString(),board:board(),showNames:S.showNames,scenes:S.scenes},null,1);
  const fname=`作戦ボード_${stamp()}.json`;
  if(!downloads){
    try{const file=new File([data],fname,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'作戦ボード'});return}}
    catch(err){if(err&&err.name=='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}
  try{await downloads.save({filename:fname,data});toast('書き出しました')}
  catch(err){const c=err&&err.code;
    if(c=='declined') return;
    if(c=='rate_limited'){toast('少し待ってからもう一度お試しください');return}
    toast('この画面では書き出せません');}
};
$('bImport').onclick=()=>$('fileIn').click();
$('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    if(o.app!=='tactics-board'||!o.board||!Array.isArray(o.board.teams)) throw 0;
    pushUndo(); setBoard(o.board);
    if(typeof o.showNames==='boolean') S.showNames=o.showNames;
    const names=new Set(S.scenes.map(s=>s.name)); let added=0;
    (o.scenes||[]).forEach(s=>{if(!s||typeof s.data!=='string')return;let n=s.name||'場面',k=2,base=n;while(names.has(n))n=`${base} (${k++})`;names.add(n);S.scenes.push({name:n,data:s.data});added++});
    sel=null; render(); save(); renderScenes();
    toast(`読み込みました（場面 ${added} 件を追加）`);
  }catch(err){toast('このファイルは読み込めません。作戦ボードで書き出したファイルを選んでください')}
});

/* ---------- shared default (default.json next to index.html) ---------- */
let sharedDefault=null;
function validData(o){return o&&o.app==='tactics-board'&&o.board&&Array.isArray(o.board.teams)}
function applyShared(o,replaceAll){
  setBoard(o.board); if(typeof o.showNames==='boolean') S.showNames=o.showNames;
  if(replaceAll){S.scenes=(o.scenes||[]).filter(x=>x&&typeof x.data==='string').map(x=>({name:x.name||'場面',data:x.data}));return S.scenes.length}
  // shared scenes replace local scenes of the same name; the viewer's own scenes stay
  let added=0;
  (o.scenes||[]).forEach(x=>{if(!x||typeof x.data!=='string')return;const n=x.name||'場面',e=S.scenes.find(y=>y.name===n);
    if(e)e.data=x.data;else S.scenes.push({name:n,data:x.data});added++});
  return added;
}
if(location.protocol.startsWith('http')){
  fetch('default.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{
    if(!validData(o)) return; sharedDefault=o; $('bDefault').hidden=false;
    if(firstLaunch){applyShared(o,true);S.defaultApplied=o.savedAt;sel=null;render();save()}
    else if(S.defaultApplied!==o.savedAt){pushUndo();applyShared(o,false);S.defaultApplied=o.savedAt;sel=null;render();save();
      toast('共有データ（初期配置）を最新版に更新しました。元に戻すで前の盤面に戻せます')}
  }).catch(()=>{});
}
$('bDefault').onclick=()=>{if(!sharedDefault)return;pushUndo();const n=applyShared(sharedDefault,false);sel=null;render();save();renderScenes();toast(`初期データを読み込みました（場面 ${n} 件を反映）`)};

/* ---------- playback ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function angLerp(a,b,k){let d=((b-a)%360+540)%360-180;return a+d*k}
function frameBetween(A,B,k){
  const o=clone(B); o.drawings=[];
  o.teams.forEach((t,ti)=>t.players.forEach((p,i)=>{const q=A.teams[ti]&&A.teams[ti].players[i];if(!q)return;
    p.x=q.x+(p.x-q.x)*k;p.y=q.y+(p.y-q.y)*k;p.a=angLerp(q.a,p.a,k)}));
  o.ball.x=A.ball.x+(B.ball.x-A.ball.x)*k; o.ball.y=A.ball.y+(B.ball.y-A.ball.y)*k;
  return o;
}
function startPlay(restart){
  if(S.scenes.length<2) return;
  if(restart!==true) pushUndo(); sel=null;
  play={list:S.scenes.map(s=>{const o=JSON.parse(s.data);fillPos(o);return o}),idx:0,phase:'hold',t0:performance.now(),speed:play?play.speed:1,raf:0,done:false};
  endEdit(); document.body.classList.add('playing'); $('playBar').hidden=false; $('insp').hidden=true; $('penBar').hidden=true;
  setBoard(play.list[0]); render(); updPlayLabel(); play.raf=requestAnimationFrame(tick);
}
function updPlayLabel(){$('pLabel').textContent=`${play.idx+1} / ${play.list.length}`;$('pSpeed').textContent=`速さ ${play.speed}×`}
function tick(now){
  if(!play||play.done) return;
  const HOLD=1300/play.speed, MOVE=1500/play.speed, el=now-play.t0;
  if(play.phase=='hold'){
    if(el>=HOLD){ if(play.idx>=play.list.length-1){play.done=true;$('pRestart').textContent='もう一度';return}
      play.phase='move'; play.t0=now; }
  }else{
    const k=Math.min(1,el/MOVE), A=play.list[play.idx], B=play.list[play.idx+1];
    setBoard(frameBetween(A,B,ease(k))); render();
    if(k>=1){play.idx++; setBoard(B); render(); updPlayLabel(); play.phase='hold'; play.t0=now;}
  }
  play.raf=requestAnimationFrame(tick);
}
function stopPlay(){if(!play)return;cancelAnimationFrame(play.raf);play=null;document.body.classList.remove('playing');$('playBar').hidden=true;$('pRestart').textContent='最初から';$('penBar').hidden=mode!='pen';render();save()}
$('bPlay').onclick=()=>startPlay();
$('pStop').onclick=stopPlay;
$('pRestart').onclick=()=>{const sp=play?play.speed:1;cancelAnimationFrame(play.raf);play={speed:sp};$('pRestart').textContent='最初から';startPlay(true)};
$('pSpeed').onclick=()=>{const s=[.5,1,2],i=s.indexOf(play.speed);play.speed=s[(i+1)%3];updPlayLabel()};

/* ---------- fullscreen ---------- */
const de=document.documentElement;
const fsOK=document.fullscreenEnabled||document.webkitFullscreenEnabled;
const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
if(fsOK&&!standalone){$('bFull').hidden=false;
  $('bFull').onclick=()=>{const cur=document.fullscreenElement||document.webkitFullscreenElement;
    if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}};
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('bFull').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'全画面を解除':'全画面'}));}

document.querySelectorAll('dialog').forEach(d=>{
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.close()});
});

['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
drawPitch(); layout(); render();
</script>
